<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Police Tactical Screen</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* --- CSS Variables --- */
        :root {
            --gold-light: #f7d774; /* 배지 밝은 부분 */
            --gold-dark: #b8860b;  /* 배지 어두운 부분, 그림자 */
            --gold-border: #e0c060; /* 버튼 테두리 */
            --panel-dark: #0f171f; /* 어두운 패널 배경 */
            --bg-dark: #0a0f14;    /* 전체 배경 */
            --lcd-green: #2c3e2c;
            --lcd-text: #5f8c5f;
        }

        /* --- Reset & Layout --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            /* 거친 금속 질감 배경 (이미지 대신 CSS 그래디언트로 표현) */
            background-image: radial-gradient(circle at center, #1a2530 0%, var(--bg-dark) 80%),
                              repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            color: #eee;
        }

        /* --- Top Bar Buttons --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .tactical-btn {
            width: 60px;
            height: 60px;
            background-color: #1a2530; /* 버튼 배경 */
            border: 2px solid var(--gold-border);
            border-radius: 12px; /* 약간 둥근 사각형 */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .tactical-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 아이콘 스타일 (지도, 수갑) */
        .material-icons {
            font-size: 32px;
            color: var(--gold-light);
            /* 아이콘에 약간의 빛나는 효과 추가 */
            text-shadow: 0 0 5px var(--gold-dark);
        }

        /* --- Center Police Badge --- */
        .center-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .badge-container {
            width: 280px;
            height: 280px;
            background: linear-gradient(145deg, var(--gold-light), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 강력한 황금빛 발광 효과 */
            box-shadow: 0 0 60px rgba(247, 215, 116, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.3);
            border: 8px solid var(--gold-dark);
            cursor: pointer;
        }
        .badge-container:active {
            transform: scale(0.98);
        }

        .badge-icon {
            font-size: 140px;
            color: #1a2530; /* 배지 내부 아이콘 색상 */
            /* 배지 내부 음각 효과 */
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5), -1px -1px 2px rgba(0,0,0,0.5);
        }


        /* --- Bottom Radio Panel --- */
        .radio-panel-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 30px;
            position: relative;
        }

        .radio-device {
            width: 85%; /* 전체 너비의 85% */
            max-width: 400px;
            background-color: #222; /* 무전기 본체 */
            border-radius: 20px 20px 10px 10px;
            padding: 25px 20px;
            border: 3px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }
        /* 무전기 상단 안테나/노브 (장식) */
        .radio-device::before {
            content: '';
            position: absolute;
            top: -15px; left: 30px;
            width: 10px; height: 20px;
            background-color: #333;
        }
        .radio-device::after {
            content: '';
            position: absolute;
            top: -10px; right: 40px;
            width: 20px; height: 15px;
            background-color: #444;
            border-radius: 5px;
        }


        /* LCD 패널 (이전 코드 활용) */
        .lcd-display {
            background-color: var(--lcd-green);
            color: var(--lcd-text);
            border: 2px solid #0f0f0f;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .lcd-main-text {
            font-size: 1.5rem;
        }
        .lcd-sub-text {
            font-size: 0.9rem;
        }


        /* 하단 PTT 버튼 (간소화) */
        .ptt-container {
            display: flex;
            justify-content: center;
        }
        .ptt-btn-large {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #800000, #600000);
            border: none;
            border-radius: 15px;
            color: #ccc;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .ptt-btn-large:active {
            transform: translateY(2px);
            background: linear-gradient(145deg, #a00000, #800000);
            color: #fff;
        }

        /* 우측 하단 장식용 아이콘 */
        .corner-decoration {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: #555;
            font-size: 24px;
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="tactical-btn" id="btn-map">
            <span class="material-icons">map</span>
        </div>
        <div class="tactical-btn" id="btn-cuffs">
            <span class="material-icons">link</span> </div>
    </div>

    <div class="center-content">
        <div class="badge-container" id="main-badge">
            <span class="material-icons badge-icon">local_police</span>
        </div>
    </div>

    <div class="radio-panel-container">
        <div class="radio-device">
            <div class="lcd-display">
                <div class="lcd-main-text">CH-03</div>
                <div class="lcd-sub-text">READY</div>
            </div>
            <div class="ptt-container">
                <button class="ptt-btn-large">PUSH TO TALK</button>
            </div>
        </div>
        <span class="material-icons corner-decoration">stars</span>
    </div>

    <script>
        // --- 간단한 클릭 이벤트 예시 ---
        document.getElementById('btn-map').addEventListener('click', () => {
            console.log('지도 버튼 클릭됨');
            // 여기에 지도 팝업 로직 추가
        });

        document.getElementById('btn-cuffs').addEventListener('click', () => {
            console.log('수갑 버튼 클릭됨');
            // 여기에 수배 목록 로직 추가
        });

        document.getElementById('main-badge').addEventListener('click', () => {
            console.log('메인 배지 클릭됨');
            // 여기에 카메라 전환 로직 추가
        });
    </script>
</body>
</html>
