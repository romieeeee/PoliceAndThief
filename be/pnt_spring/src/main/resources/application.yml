spring:
  application:
    name: pnt_spring
  profiles:
    include: secret

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
    show-sql: true
    # data.sql 로드
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      auto-index-creation: true # 인덱스 생성 설정
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_NAME}?authSource=admin
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASSWORD}
# swagger
springdoc:
  api-docs:
    enabled: true  # API 문서(`/v3/api-docs`) 활성화 여부 (기본값: true)
    path: /api-docs  # API 문서의 엔드포인트 변경 (기본값: /v3/api-docs)
    groups.enabled: true  # 여러 개의 API 그룹을 지원할지 여부

  swagger-ui:
    enabled: true  # Swagger UI 활성화 여부 (기본값: true)
    path: /swagger-ui.html  # Swagger UI 접속 경로 변경 (기본값: /swagger-ui.html)
    operationsSorter: method  # API 정렬 기준 (alpha: 알파벳순, method: HTTP 메서드 순)
    tagsSorter: alpha  # 태그 정렬 방식 (alpha: 알파벳순 정렬)
    display-request-duration: true  # 요청 실행 시간 표시 여부
    doc-expansion: none  # Swagger UI에서 API 설명의 기본 펼침 상태 (none: 닫힘, list: 펼침, full: 전체 펼침)
    persistAuthorization: true  # 페이지 새로고침 후에도 Authorization 헤더 유지 여부
    defaultModelsExpandDepth: -1  # 모델 스키마의 기본 펼침 깊이 (-1이면 모델 펼쳐지지 않음)

  paths-to-match: # OpenAPI 문서에서 포함할 엔드포인트 패턴
    - /**  # /api로 시작하는 모든 경로 포함
  cache:
    disabled: true  # OpenAPI 문서의 캐싱 비활성화 (기본값: false)
  show-actuator: false  # Spring Actuator 엔드포인트를 Swagger UI에 표시할지 여부 (기본값: false)
  servers:
    - url: https://i14d104.p.ssafy.io/spring
      description: "Production Server"
    - url: http://localhost:8080/spring
      description: "Local Development"

jwt:
  secret: ${JWT_SECRET}

oauth2:
  kakao:
    app-id: ${KAKAO_APP_ID}
  google:
    client-id:

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /spring

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}

livekit:
  url: wss://ssafy-d104-f7ty2iv4.livekit.cloud  # LiveKit Cloud WebSocket URL
  api-key: ${LIVEKIT_API_KEY}            # 발급받은 API Key
  api-secret: ${LIVEKIT_API_SECRET}      # 발급받은 API Secret