upstream websocket_nodes {
    ip_hash;
    server websocket-server:8090;
    server websocket-server:8091;
    server websocket-server:8092;
    server websocket-server:8093;
}

server {
    listen 80;
    server_name i14d104.p.ssafy.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name i14d104.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i14d104.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i14d104.p.ssafy.io/privkey.pem;

    location /spring/ {
        proxy_pass http://spring-app:8080/spring/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /node/ {
        proxy_pass http://websocket_nodes/;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://websocket_nodes/socket.io/;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
